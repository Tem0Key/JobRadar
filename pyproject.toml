[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "0.1.0"
description = "Reliable personal job aggregation from public Greenhouse and Lever boards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "rich>=13.8,<16",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
jobradar = "jobradar.cli:app"

[tool.setuptools.packages.find]
include = ["jobradar*"]

[tool.setuptools.package-data]
"jobradar.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in checks against real public APIs"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "data", "exports", ".pytest-tmp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
