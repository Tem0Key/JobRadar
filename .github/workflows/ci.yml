name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      JOBRADAR_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]" -c requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check JavaScript syntax
        run: node --check jobradar/web/static/app.js
      - name: Test without public API requests
        run: python -m pytest -q --cov=jobradar --cov-report=term-missing
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: CLI smoke test
        run: python -m jobradar --help
